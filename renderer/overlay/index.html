<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self' blob:; script-src 'self'; worker-src 'self'">
  <title>OxoFlow overlay</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="pill" class="pill" data-phase="idle" aria-live="polite">
    <div class="glow" aria-hidden="true"></div>
    <div class="row" id="row">
      <div class="orb" aria-hidden="true"><span></span></div>
      <div class="check" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="13" height="13"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></svg>
      </div>
      <div class="cross" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="11" height="11"><path d="M7 7l10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
      </div>
      <canvas class="wave" id="wave" aria-hidden="true"></canvas>
      <div class="label" id="label">Écoute</div>
      <div class="preview" id="preview"></div>
      <div class="timer" id="timer">0:00</div>
      <div class="esc" id="esc"><kbd>Échap</kbd></div>
      <div class="hint" id="hint"><kbd id="hint-key">fn</kbd><span id="hint-text">Maintiens fn pour dicter</span></div>
    </div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
